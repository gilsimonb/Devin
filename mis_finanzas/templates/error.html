{% extends "layout_auth.html" %}
{% from "_macros.html" import icono %}
{% block titulo %}Error {{ codigo }}{% endblock %}
{% block encabezado %}
<div class="icono-destacado icono-destacado--rojo">{{ icono('alert') }}</div>
<h2 class="centrado">Algo no salió bien</h2>

{% block contenido %}

{% endblock %}
